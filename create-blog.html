<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Blog | BlogSpace</title>
    <link rel="stylesheet" href="style.css"><style>
    .editor-container {
        max-width: 850px;
        margin: 55px auto;
        padding: 0 25px;
    }

    .editor-heading {
        margin-bottom: 30px;
    }

    .editor-heading h1 {
        font-family: 'Manrope', sans-serif;
        font-size: clamp(30px, 5vw, 44px);
        margin-bottom: 10px;
    }

    .editor-heading p {
        color: var(--muted);
    }

    .editor-card {
        background: white;
        padding: 35px;
        border: 1px solid var(--border);
        border-radius: 14px;
    }

    .form-group {
        margin-bottom: 23px;
    }

    .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 9px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 7px;
        font: inherit;
        background: white;
        outline: none;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
        border-color: var(--primary);
    }

    .form-group textarea {
        min-height: 230px;
        resize: vertical;
        line-height: 1.8;
    }

    .editor-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 25px;
    }

    .editor-actions button {
        cursor: pointer;
        font: inherit;
    }

    .editor-message {
        margin-top: 18px;
        font-size: 14px;
    }

    .word-count {
        color: var(--muted);
        text-align: right;
        font-size: 12px;
        margin-top: 6px;
    }

    @media (max-width: 600px) {
        .editor-card {
            padding: 22px;
        }
    }
</style>

</head><body><header class="navbar">
    <a href="index.html" class="logo">Blog<span>Space.</span></a>

    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<main class="editor-container">

    <div class="editor-heading">
        <span class="eyebrow">YOUR CREATIVE SPACE</span>
        <h1>Write your story.</h1>
        <p>Every great blog begins with an idea. Turn yours into a story worth sharing.</p>
    </div>

    <section class="editor-card">

        <form id="blogForm">

            <div class="form-group">
                <label for="blogTitle">Blog Title *</label>
                <input
                    type="text"
                    id="blogTitle"
                    placeholder="Give your story a meaningful title"
                    maxlength="120"
                    required
                >
            </div>

            <div class="form-group">
                <label for="blogCategory">Category *</label>
                <select id="blogCategory" required>
                    <option value="">Choose a category</option>
                    <option value="Technology">Technology</option>
                    <option value="Education">Education</option>
                    <option value="Personal Growth">Personal Growth</option>
                    <option value="Lifestyle">Lifestyle</option>
                    <option value="Travel">Travel</option>
                    <option value="Creativity">Creativity</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="blogContent">Your Story *</label>
                <textarea
                    id="blogContent"
                    placeholder="Start writing your thoughts here..."
                    minlength="20"
                    maxlength="10000"
                    required
                ></textarea>

                <div class="word-count">
                    <span id="characterCount">0</span>/10000 characters
                </div>
            </div>

            <div class="editor-actions">
                <button type="submit" class="button primary-button">
                    Publish Blog ↗
                </button>

                <a href="dashboard.html" class="button secondary-button">
                    Cancel
                </a>
            </div>

            <p id="blogMessage" class="editor-message" role="status"></p>

        </form>

    </section>

</main>

<footer class="footer">
    <a href="index.html" class="logo">Blog<span>Space.</span></a>
    <p>Made for curious minds and creative thinkers.</p>
    <span>© 2026 BlogSpace</span>
</footer>

<script>
    const currentUser = JSON.parse(
        localStorage.getItem("blogspace_currentUser") || "null"
    );

    if (!currentUser) {
        window.location.replace("login.html");
    }

    const blogContent = document.getElementById("blogContent");
    const characterCount = document.getElementById("characterCount");
    const blogMessage = document.getElementById("blogMessage");

    blogContent.addEventListener("input", function() {
        characterCount.textContent = blogContent.value.length;
    });

    document.getElementById("blogForm").addEventListener("submit", function(event) {
        event.preventDefault();

        if (!currentUser) {
            window.location.href = "login.html";
            return;
        }

        const title = document.getElementById("blogTitle").value.trim();
        const category = document.getElementById("blogCategory").value;
        const content = blogContent.value.trim();

        if (title.length < 3) {
            blogMessage.textContent = "Please enter a title with at least 3 characters.";
            return;
        }

        if (content.length < 20) {
            blogMessage.textContent = "Your story must contain at least 20 characters.";
            return;
        }

        let blogs = [];

        try {
            blogs = JSON.parse(localStorage.getItem("blogspace_blogs")) || [];

            if (!Array.isArray(blogs)) {
                blogs = [];
            }
        } catch (error) {
            blogMessage.textContent = "Could not load saved blogs. Please try again.";
            return;
        }

        const newBlog = {
            id: Date.now(),
            title: title,
            category: category,
            content: content,
            author: currentUser.name,
            authorEmail: currentUser.email,
            date: new Date().toLocaleDateString()
        };

        blogs.push(newBlog);

        try {
            localStorage.setItem("blogspace_blogs", JSON.stringify(blogs));
        } catch (error) {
            blogMessage.textContent = "Could not save your blog. Please try again.";
            return;
        }

        blogMessage.style.color = "#385237";
        blogMessage.textContent = "Blog published successfully! Opening your dashboard...";

        setTimeout(function() {
            window.location.href = "dashboard.html";
        }, 1000);
    });
</script>

</body>
</html>
